<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - Sports League</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="matches-page">

    <nav class="navbar">

        <div class="logo">
            🏏 SPORTS LEAGUE
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="user.html">Dashboard</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Players</a>
            <a href="results.html">Results</a>
            <a href="standings.html">Standings</a>

        </div>

    </nav>


    <div class="dashboard">

        <p class="section-small-title">
            MATCH MANAGEMENT
        </p>

        <h1>League Matches</h1>

        <p>
            Schedule and view all upcoming league matches.
        </p>


        <!-- ADMIN SECTION -->

        <div id="adminSection" class="input-container">

            <h2>Schedule New Match</h2>

            <input
                type="text"
                id="team1"
                placeholder="Enter Team 1"
            >

            <input
                type="text"
                id="team2"
                placeholder="Enter Team 2"
            >

            <input
                type="date"
                id="matchDate"
            >

            <input
                type="text"
                id="venue"
                placeholder="Enter Venue"
            >

            <button onclick="addMatch()">
                Add Match
            </button>

        </div>


        <!-- MATCH TABLE -->

        <div class="table-container">

            <h2>All Matches</h2>

            <table>

                <thead>

                    <tr>
                        <th>Match ID</th>
                        <th>Team 1</th>
                        <th>Team 2</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>

                </thead>

                <tbody id="matchTable"></tbody>

            </table>

        </div>


        <div class="page-navigation">

            <a href="teams.html">
                Teams
            </a>

            <a href="players.html">
                Players
            </a>

            <a href="results.html">
                Results
            </a>

            <a href="user.html">
                User Dashboard
            </a>

            <a href="admin.html">
                Admin Dashboard
            </a>

        </div>

    </div>


    <script>

        let loggedIn =
            localStorage.getItem("loggedIn");


        // Only Admin can add matches

        if (loggedIn !== "admin") {

            document.getElementById("adminSection").style.display = "none";

        }


        let matches =
            JSON.parse(localStorage.getItem("matches")) || [];


        function addMatch() {

            let team1 =
                document.getElementById("team1").value.trim();

            let team2 =
                document.getElementById("team2").value.trim();

            let date =
                document.getElementById("matchDate").value;

            let venue =
                document.getElementById("venue").value.trim();


            if (
                team1 === "" ||
                team2 === "" ||
                date === "" ||
                venue === ""
            ) {

                alert("Please enter all match details");

                return;

            }


            if (team1 === team2) {

                alert("Team 1 and Team 2 must be different");

                return;

            }


            matches.push({

                id: matches.length + 1,

                team1: team1,

                team2: team2,

                date: date,

                venue: venue

            });


            localStorage.setItem(
                "matches",
                JSON.stringify(matches)
            );


            document.getElementById("team1").value = "";

            document.getElementById("team2").value = "";

            document.getElementById("matchDate").value = "";

            document.getElementById("venue").value = "";


            displayMatches();

        }


        function displayMatches() {

            let table =
                document.getElementById("matchTable");


            table.innerHTML = "";


            matches.forEach(function(match) {

                table.innerHTML += `

                    <tr>

                        <td>${match.id}</td>

                        <td>${match.team1}</td>

                        <td>${match.team2}</td>

                        <td>${match.date}</td>

                        <td>${match.venue}</td>

                    </tr>

                `;

            });

        }


        displayMatches();

    </script>

</body>

</html>
