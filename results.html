<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Sports League</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="results-page">

    <nav class="navbar">

        <div class="logo">
            🏏 SPORTS LEAGUE
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="user.html">Dashboard</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Players</a>
            <a href="matches.html">Matches</a>
            <a href="standings.html">Standings</a>

        </div>

    </nav>


    <div class="dashboard">

        <p class="section-small-title">
            MATCH RESULTS
        </p>

        <h1>Match Results</h1>

        <p>
            Add and view the results of completed league matches.
        </p>


        <!-- ADMIN SECTION -->

        <div id="adminSection" class="input-container">

            <h2>Add Match Result</h2>

            <input
                type="text"
                id="team1"
                placeholder="Enter Team 1"
            >

            <input
                type="number"
                id="score1"
                placeholder="Team 1 Score"
            >

            <input
                type="text"
                id="team2"
                placeholder="Enter Team 2"
            >

            <input
                type="number"
                id="score2"
                placeholder="Team 2 Score"
            >

            <button onclick="addResult()">
                Add Result
            </button>

        </div>


        <!-- RESULTS TABLE -->

        <div class="table-container">

            <h2>All Results</h2>

            <table>

                <thead>

                    <tr>
                        <th>Result ID</th>
                        <th>Team 1</th>
                        <th>Score</th>
                        <th>Team 2</th>
                        <th>Score</th>
                        <th>Winner</th>
                    </tr>

                </thead>

                <tbody id="resultTable"></tbody>

            </table>

        </div>


        <div class="page-navigation">

            <a href="matches.html">
                Matches
            </a>

            <a href="standings.html">
                Standings
            </a>

            <a href="user.html">
                User Dashboard
            </a>

            <a href="admin.html">
                Admin Dashboard
            </a>

        </div>

    </div>


    <script>

        let loggedIn =
            localStorage.getItem("loggedIn");


        // Only Admin can add results

        if (loggedIn !== "admin") {

            document.getElementById("adminSection").style.display = "none";

        }


        let results =
            JSON.parse(localStorage.getItem("results")) || [];


        function addResult() {

            let team1 =
                document.getElementById("team1").value.trim();

            let score1 =
                Number(document.getElementById("score1").value);

            let team2 =
                document.getElementById("team2").value.trim();

            let score2 =
                Number(document.getElementById("score2").value);


            if (
                team1 === "" ||
                team2 === "" ||
                document.getElementById("score1").value === "" ||
                document.getElementById("score2").value === ""
            ) {

                alert("Please enter all result details");

                return;

            }


            if (team1 === team2) {

                alert("Team 1 and Team 2 must be different");

                return;

            }


            let winner;


            if (score1 > score2) {

                winner = team1;

            }

            else if (score2 > score1) {

                winner = team2;

            }

            else {

                winner = "Draw";

            }


            results.push({

                id: results.length + 1,

                team1: team1,

                score1: score1,

                team2: team2,

                score2: score2,

                winner: winner

            });


            localStorage.setItem(
                "results",
                JSON.stringify(results)
            );


            document.getElementById("team1").value = "";

            document.getElementById("score1").value = "";

            document.getElementById("team2").value = "";

            document.getElementById("score2").value = "";


            displayResults();

        }


        function displayResults() {

            let table =
                document.getElementById("resultTable");


            table.innerHTML = "";


            results.forEach(function(result) {

                table.innerHTML += `

                    <tr>

                        <td>${result.id}</td>

                        <td>${result.team1}</td>

                        <td>${result.score1}</td>

                        <td>${result.team2}</td>

                        <td>${result.score2}</td>

                        <td>${result.winner}</td>

                    </tr>

                `;

            });

        }


        displayResults();

    </script>

</body>

</html>
