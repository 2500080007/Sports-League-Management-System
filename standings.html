<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings - Sports League</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="standings-page">

    <nav class="navbar">
        <div class="logo">🏏 SPORTS LEAGUE</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="user.html">Dashboard</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Players</a>
            <a href="matches.html">Matches</a>
            <a href="results.html">Results</a>
        </div>
    </nav>


    <div class="dashboard">

        <p class="section-small-title">LEAGUE TABLE</p>

        <h1>League Standings</h1>

        <p>
            View team performance and points in the league.
        </p>


        <div class="table-container">

            <h2>Points Table</h2>

            <table>

                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Team</th>
                        <th>Played</th>
                        <th>Won</th>
                        <th>Lost</th>
                        <th>Draw</th>
                        <th>Points</th>
                    </tr>
                </thead>

                <tbody id="standingsTable"></tbody>

            </table>

        </div>


        <div class="page-navigation">

            <a href="teams.html">
                Teams
            </a>

            <a href="players.html">
                Players
            </a>

            <a href="matches.html">
                Matches
            </a>

            <a href="results.html">
                Results
            </a>

            <a href="user.html">
                User Dashboard
            </a>

        </div>

    </div>


    <script>

        let teams =
            JSON.parse(localStorage.getItem("teams")) || [];

        let results =
            JSON.parse(localStorage.getItem("results")) || [];


        function calculateStandings() {

            let standings = [];


            teams.forEach(function(team) {

                standings.push({

                    name: team.name,

                    played: 0,

                    won: 0,

                    lost: 0,

                    draw: 0,

                    points: 0

                });

            });


            results.forEach(function(result) {

                let team1 = standings.find(
                    team => team.name === result.team1
                );

                let team2 = standings.find(
                    team => team.name === result.team2
                );


                if (!team1 || !team2) {
                    return;
                }


                team1.played++;
                team2.played++;


                if (result.winner === "Draw") {

                    team1.draw++;
                    team2.draw++;

                    team1.points += 1;
                    team2.points += 1;

                }

                else if (result.winner === team1.name) {

                    team1.won++;
                    team2.lost++;

                    team1.points += 3;

                }

                else if (result.winner === team2.name) {

                    team2.won++;
                    team1.lost++;

                    team2.points += 3;

                }

            });


            standings.sort(
                (a, b) => b.points - a.points
            );


            displayStandings(standings);

        }


        function displayStandings(standings) {

            let table =
                document.getElementById("standingsTable");


            table.innerHTML = "";


            standings.forEach(function(team, index) {

                table.innerHTML += `

                    <tr>

                        <td>${index + 1}</td>

                        <td>${team.name}</td>

                        <td>${team.played}</td>

                        <td>${team.won}</td>

                        <td>${team.lost}</td>

                        <td>${team.draw}</td>

                        <td>${team.points}</td>

                    </tr>

                `;

            });

        }


        calculateStandings();

    </script>

</body>

</html>
