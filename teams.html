<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - Sports League</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="teams-page">

    <nav class="navbar">

        <div class="logo">
            🏏 SPORTS LEAGUE
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="user.html">Dashboard</a>
            <a href="players.html">Players</a>
            <a href="matches.html">Matches</a>
            <a href="results.html">Results</a>
            <a href="standings.html">Standings</a>

        </div>

    </nav>


    <div class="dashboard">

        <p class="section-small-title">
            LEAGUE MANAGEMENT
        </p>

        <h1>Sports Teams</h1>

        <p>
            Manage and view all teams participating in the sports league.
        </p>


        <!-- ADMIN SECTION -->

        <div id="adminSection" class="input-container">

            <h2>Add New Team</h2>

            <input
                type="text"
                id="teamName"
                placeholder="Enter Team Name"
            >

            <button onclick="addTeam()">
                Add Team
            </button>

        </div>


        <!-- TEAM TABLE -->

        <div class="table-container">

            <h2>All Teams</h2>

            <table>

                <thead>

                    <tr>
                        <th>Team ID</th>
                        <th>Team Name</th>
                    </tr>

                </thead>

                <tbody id="teamTable"></tbody>

            </table>

        </div>


        <div class="page-navigation">

            <a href="user.html">
                User Dashboard
            </a>

            <a href="admin.html">
                Admin Dashboard
            </a>

        </div>

    </div>


    <script>

        let loggedIn = localStorage.getItem("loggedIn");


        // Only Admin can add teams

        if (loggedIn !== "admin") {

            document.getElementById("adminSection").style.display = "none";

        }


        let teams =
            JSON.parse(localStorage.getItem("teams")) || [];


        function addTeam() {

            let name =
                document.getElementById("teamName").value.trim();


            if (name === "") {

                alert("Enter team name");

                return;

            }


            teams.push({

                id: teams.length + 1,

                name: name

            });


            localStorage.setItem(
                "teams",
                JSON.stringify(teams)
            );


            document.getElementById("teamName").value = "";


            displayTeams();

        }


        function displayTeams() {

            let table =
                document.getElementById("teamTable");


            table.innerHTML = "";


            teams.forEach(function(team) {

                table.innerHTML += `

                    <tr>

                        <td>${team.id}</td>

                        <td>${team.name}</td>

                    </tr>

                `;

            });

        }


        displayTeams();

    </script>

</body>

</html>
