<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="user-page">

    <div class="dashboard">

        <h1>User Dashboard</h1>

        <p>
            Welcome, <span id="username"></span>
        </p>

        <div class="dashboard-grid">

            <div class="dashboard-card">
                <h3>🏆 Teams</h3>
                <p>View all teams</p>
                <a href="teams.html">View</a>
            </div>

            <div class="dashboard-card">
                <h3>👤 Players</h3>
                <p>View all players</p>
                <a href="players.html">View</a>
            </div>

            <div class="dashboard-card">
                <h3>🏏 Matches</h3>
                <p>View matches</p>
                <a href="matches.html">View</a>
            </div>

            <div class="dashboard-card">
                <h3>📊 Results</h3>
                <p>View results</p>
                <a href="results.html">View</a>
            </div>

            <div class="dashboard-card">
                <h3>🥇 Standings</h3>
                <p>View league table</p>
                <a href="standings.html">View</a>
            </div>

        </div>

    </div>


    <script>

        let user = localStorage.getItem("currentUser");

        if (user) {

            document.getElementById("username").innerText = user;

        }

    </script>

</body>
</html>
